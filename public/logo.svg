<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Isaac Onyango Ouma monogram">
  <defs>
    <!-- Indigo tile so the mark reads as a solid shape in a crowded tab strip -->
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#tile)" />

  <!-- "IO" knocked out of the tile: two heavy shapes stay readable at 16px -->
  <g fill="none" stroke="#10101c" stroke-width="13" stroke-linecap="round">
    <line x1="25.5" y1="30" x2="25.5" y2="70" />
    <circle cx="59" cy="50" r="15.5" />
  </g>
</svg>
